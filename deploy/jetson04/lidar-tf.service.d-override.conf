[Unit]
# The stock unit is named for an S3, but the driver reports a 5 kHz sample
# rate (an S3 samples at 32 kHz), so this is a C1-class unit.
Description=Static TF for RPLIDAR C1 (corrected lateral offset)

[Service]
# Measured 2026-08-13: the lidar sits 0.04 m to the rover's LEFT. The stock
# unit hardcoded --y 0, putting a 4 cm lateral bias into every map. Confirmed
# independently: with y=0.04 the lidar places the camera mast at y=-0.038,
# against an operator tape measurement of -0.040.
ExecStart=
ExecStart=/bin/bash -lc "source /opt/ros/humble/setup.bash && ros2 run tf2_ros static_transform_publisher --x 0.0775 --y 0.04 --z 0.048 --roll 0 --pitch 0 --yaw 3.14159 --frame-id base_link --child-frame-id laser_frame"

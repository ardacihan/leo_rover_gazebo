amcl:
  ros__parameters:
    alpha1: 0.25
    alpha2: 0.2
    alpha3: 0.15
    alpha4: 0.2
    use_sim_time: true
    base_frame_id: "leo1/base_link"
    global_frame_id: "map"
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "leo1/odom"
    scan_topic: /leo1/scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true
    # Post-date map->odom far enough to cover the measured 1.9-2.8 s
    # simulation-time scheduling lag in the Docker validation environment.
    transform_tolerance: 3.5
    z_hit: 0.6
    z_max: 0.05
    z_rand: 0.3
    z_short: 0.05

explore_node:
  ros__parameters:
    use_sim_time: true
    robot_base_frame: leo1/base_link
    # Read the SLAM map directly (track_unknown_space is also on in the
    # global costmap, but /map keeps frontiers visible beyond costmap bounds).
    costmap_topic: map
    costmap_updates_topic: map_updates
    return_to_init: true
    visualize: true
    planner_frequency: 0.2
    progress_timeout: 30.0
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.5
    min_frontier_size: 0.5

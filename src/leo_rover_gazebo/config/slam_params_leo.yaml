slam_toolbox:
  ros__parameters:
    # --- ROS Parameters ---
    use_sim_time: true
    odom_frame: "leo1/odom"
    base_frame: "leo1/base_link"
    map_frame: "map"
    scan_topic: "/leo1/scan"

    # --- Mapping Mode ---
    mode: mapping

    # --- Scan Matching ---
    use_scan_matching: true
    use_scan_barycenter: true
    # 0.5 s / 0.2 rad starved the matcher during in-place rotations
    # (skid-steer yaw odometry drifts fast) and caused rotated duplicate
    # maps in corridor worlds. 0.05 s (pre-b2af3a6) was a CPU hog; these
    # sit in between and keep RTF ~1 headless.
    minimum_time_interval: 0.15
    scan_queue_size: 5

    # --- Map Parameters ---
    resolution: 0.05
    max_laser_range: 20.0
    map_update_interval: 1.0
    transform_publish_period: 0.05

    # --- Performance & Optimization ---
    solver_plugin: "solver_plugins::CeresSolver"
    ceres_linear_solver: "SPARSE_NORMAL_CHOLESKY"
    ceres_preconditioner: "SCHUR_JACOBI"
    ceres_trust_strategy: "LEVENBERG_MARQUARDT"

    do_loop_closing: true
    loop_search_maximum_distance: 5.0
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    # Wider correlation window so the matcher recovers from the yaw error
    # a skid-steer accumulates during in-place rotations (defaults 0.5/0.349).
    correlation_search_space_dimension: 0.8
    coarse_search_angle_offset: 0.523

    # --- Buffers and Limits ---
    tf_buffer_duration: 30.0
    transform_timeout: 0.5
    stack_size_to_use: 40000000

    # --- Interactive Mode ---
    enable_interactive_mode: true

map_merge:
  ros__parameters:
    merging_rate: 4.0
    discovery_rate: 0.05
    estimation_rate: 0.5
    estimation_confidence: 0.6
    # Per-robot maps are published on /leo{i}/map (relative "map" under each
    # robot namespace). With known_init_poses the merge is a rigid compose,
    # no feature estimation, so it is robust even on sparse early maps.
    robot_map_topic: map
    robot_map_updates_topic: map_updates
    robot_namespace: ""
    merged_map_topic: map
    world_frame: map
    known_init_poses: true

    # Initial poses = each rover's Gazebo spawn pose expressed in the merged
    # "map" frame (== leo1's start). MUST match default_spawns in
    # two_robots_gpu.launch.py and the static map->leo{i}/map TFs in
    # map_merge_leo.launch.py.
    /leo1/map_merge/init_pose_x: 0.0
    /leo1/map_merge/init_pose_y: 0.0
    /leo1/map_merge/init_pose_z: 0.0
    /leo1/map_merge/init_pose_yaw: 0.0

    /leo2/map_merge/init_pose_x: 1.5
    /leo2/map_merge/init_pose_y: 0.0
    /leo2/map_merge/init_pose_z: 0.0
    /leo2/map_merge/init_pose_yaw: 0.0

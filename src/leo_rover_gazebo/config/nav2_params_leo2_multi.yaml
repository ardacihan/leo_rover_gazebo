bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: leo2/map
    robot_base_frame: "leo2/base_link"
    odom_topic: /leo2/odom

controller_server:
  ros__parameters:
    use_sim_time: True
    cmd_vel_topic: /leo2/cmd_vel
    controller_frequency: 20.0
    # ControllerServer transforms the robot pose before invoking FollowPath.
    # Keep this in step with the plugin tolerance below; setting only the
    # plugin left the server rejecting otherwise usable AMCL/SLAM transforms.
    transform_tolerance: 3.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      # PoseProgressChecker counts rotation as progress, so long in-place
      # turns don't trip false "failed to make progress" aborts.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.3
      required_movement_angle: 0.5
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # Rotation shim turns toward the path heading, then Regulated Pure
    # Pursuit follows it - much steadier than DWB for diff drive in tight
    # spaces. (Old DWB config in git history if a fallback is ever needed.)
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      # Halved from 0.8/3.2: in-place rotation is where skid-steer wheel
      # slip corrupts odometry fastest, which drove SLAM drift in small
      # rooms (depot_world). Slower spins keep scan matching converged.
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      # --- Regulated Pure Pursuit ---
      desired_linear_vel: 0.26
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      # slam_toolbox's map->odom transform follows the last processed scan.
      # Under Docker/WSL load it can trail simulation time by ~1.6 s; a 0.5 s
      # tolerance made short sweep goals circle while every path transform was
      # rejected as stale. Keep enough margin for one delayed SLAM update.
      transform_tolerance: 3.5
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_cost_regulated_linear_velocity_scaling: false
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: leo2/odom
      robot_base_frame: "leo2/base_link"
      robot_radius: 0.24
      width: 10
      height: 10
      resolution: 0.05
      rolling_window: True
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan camera
        scan:
          topic: /leo2/scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          sensor_frame: "leo2/sensor_lidar_link"
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          qos_overrides:
            /leo2/scan:
              subscription:
                reliability: "best_effort"
        # Depth camera sees low furniture (table bases, crossbars) that the
        # 2D lidar plane misses; the rover wedged on those during exploration.
        camera:
          topic: /leo2/camera/points
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.05
          max_obstacle_height: 0.45
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: leo2/map
      robot_base_frame: "leo2/base_link"
      robot_radius: 0.24
      width: 20
      height: 20
      resolution: 0.05
      origin_x: -10.0
      origin_y: -10.0
      track_unknown_space: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /leo2/map
        enabled: True
        map_subscribe_transient_local: True
        subscribe_to_updates: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan camera
        camera:
          topic: /leo2/camera/points
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.05
          max_obstacle_height: 0.45
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
        scan:
          topic: /leo2/scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          sensor_frame: "leo2/sensor_lidar_link"
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          qos_overrides:
            /leo2/scan:
              subscription:
                reliability: "best_effort"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: True
      allow_unknown: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_frame: "leo2/odom"
    global_frame: leo2/map
    robot_base_frame: "leo2/base_link"
    transform_tolerance: 0.5

smoother_server:
  ros__parameters:
    use_sim_time: True

velocity_smoother:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True

lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: True
    bond_timeout: 10.0
    bond_respawn_max_duration: 10.0
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      # 20 s of sitting against a wall delayed backup. 8 s is enough to
      # decide the path is blocked and run the BT recovery (BackUp).
      movement_time_allowance: 8.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Path refreshes arrive ~every 1.4 s while the map grows; at 0.5 rad the
      # shim stopped to rotate on a large share of them (run 2: 18% of the run
      # rotating in place). 3.14 never rotated and drove straight into a wall
      # (jetson-02 2026-08-25). 0.55 still ignores small heading noise.
      angular_dist_threshold: 0.55
      angular_disengage_threshold: 0.45
      forward_sampling_distance: 0.35
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      closed_loop: true
      desired_linear_vel: 0.26
      lookahead_dist: 0.5
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      # Slow down for tight curves and near obstacles instead of refusing to move.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 8.0
      # The RotationShim above already handles genuinely-behind headings
      # (>1.0 rad). With this also true, both layers stopped to spin on
      # every path refresh (~1.4 s while the map grows) and the 2026-08-25
      # run measured 73% of commands as pure rotation. RPP without it still
      # arcs through moderate heading changes instead of spinning first.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 1.0
      rotate_to_heading_angular_vel: 1.2
      allow_reversing: false
      max_robot_pose_search_dist: 5.0
      # FootprintApproach is the wall brake. RPP's own collision check
      # reports patience exceeded in inflated cells and the BT only spins
      # (live jetson-02 2026-08-25) instead of driving along the wall.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 0.8
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.025
      footprint: '[[0.21, 0.21], [0.21, -0.21], [-0.21, -0.21], [-0.21, 0.21]]'
      # Padded to 0.26 m half-width to match the collision monitor's stop
      # box. At 0.01 the planner's lethal footprint (0.22 m) was smaller than
      # the box that actually stops the rover, so it planned between table
      # legs it could enter but never occupy (wedged there live 2026-08-25).
      footprint_padding: 0.05
      transform_tolerance: 0.3
      plugins:
      - obstacle_layer
      - camera_obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        footprint_clearing_enabled: true
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.02
          max_obstacle_height: 1.2
          obstacle_min_range: 0.05
          obstacle_max_range: 4.0
          raytrace_min_range: 0.05
          raytrace_max_range: 5.0
          inf_is_valid: true
      # The camera lives in its own layer: when it shared the scan's layer,
      # every lidar sweep raytrace-cleared the cells the camera had just
      # marked for obstacles below the lidar plane (shoes, pi-pucks,
      # bottles) -- the lidar's rays pass straight over them. Verified on
      # drive_2026-08-20 t=472s. In its own layer the camera clears only
      # against its own rays.
      camera_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        footprint_clearing_enabled: true
        enabled: true
        observation_sources: camera
        camera:
          # Filtered by leo_nav2_exploration cloud_filter: ground removal,
          # voxel clustering, and 2-of-3-frame temporal voting -- a return
          # that exists for a single frame can never become an obstacle.
          topic: /camera_points_filtered
          data_type: PointCloud2
          marking: true
          clearing: true
          # Robust profile (2026-08-20 evening): the operating floor is kept
          # clear, so the camera's job is chair and table legs, crossbars,
          # and table tops -- structures with points through this whole
          # band. 0.10 sits above the floor-noise tail entirely; low loose
          # objects (shoes, pi-pucks) are deliberately out of scope.
          min_obstacle_height: 0.10
          max_obstacle_height: 0.60
          obstacle_min_range: 0.25
          # RealSense depth error grows ~quadratically with range; distant
          # floor pixels were the phantom-blob source. Trust the camera only
          # close in; beyond that the lidar owns detection.
          obstacle_max_range: 1.2
          raytrace_min_range: 0.25
          raytrace_max_range: 2.7
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # 0.30 let plans run close enough to walls that the collision
        # monitor's 0.26 m stop box filled and froze the rover (2026-08-25,
        # twice: pinned at a corner, then against a wall, recoveries all
        # collision-blocked). 0.38 keeps planned paths a hand's width
        # further out; inflated cells are penalised, not lethal, so tight
        # doorways remain traversable.
        inflation_radius: 0.38
        cost_scaling_factor: 8.0
      # Full 4 m / 2.5 cm grids at 5 Hz dominate Jetson DDS even on localhost.
      always_send_full_costmap: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      footprint: '[[0.21, 0.21], [0.21, -0.21], [-0.21, -0.21], [-0.21, 0.21]]'
      # Padded to 0.26 m half-width to match the collision monitor's stop
      # box. At 0.01 the planner's lethal footprint (0.22 m) was smaller than
      # the box that actually stops the rover, so it planned between table
      # legs it could enter but never occupy (wedged there live 2026-08-25).
      footprint_padding: 0.05
      track_unknown_space: true
      transform_tolerance: 0.3
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        footprint_clearing_enabled: true
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.02
          max_obstacle_height: 1.2
          obstacle_min_range: 0.05
          obstacle_max_range: 4.0
          raytrace_min_range: 0.05
          raytrace_max_range: 5.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # 0.30 let plans run close enough to walls that the collision
        # monitor's 0.26 m stop box filled and froze the rover (2026-08-25,
        # twice: pinned at a corner, then against a wall, recoveries all
        # collision-blocked). 0.38 keeps planned paths a hand's width
        # further out; inflated cells are penalised, not lethal, so tight
        # doorways remain traversable.
        inflation_radius: 0.38
        cost_scaling_factor: 8.0
      always_send_full_costmap: false
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
      # >>> navfn-planner (apply_navfn_planner.py)
      # original:
      #     GridBased:
      #       plugin: nav2_smac_planner/SmacPlannerLattice
      #       lattice_filepath: __LATTICE_FILE__
      #       tolerance: 0.15
      #       allow_unknown: true
      #       max_iterations: 1000000
      #       max_on_approach_iterations: 1000
      #       max_planning_time: 5.0
      #       analytic_expansion_ratio: 3.5
      #       analytic_expansion_max_length: 2.5
      #       reverse_penalty: 2.5
      #       change_penalty: 0.2
      #       non_straight_penalty: 1.15
      #       cost_penalty: 3.0
      #       retrospective_penalty: 0.025
      #       rotation_penalty: 2.0
      #       lookup_table_size: 10.0
      #       cache_obstacle_heuristic: true
      #       allow_reverse_expansion: true
      #       smooth_path: false
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      # Frontier goals sit on the boundary of known space by construction, so
      # a planner that refuses unknown cells cannot reach any of them.
      allow_unknown: true
      # Wider than the lattice's 0.15: explore_lite's goals land wherever the
      # frontier centroid is, which is often a cell or two inside inflation.
      tolerance: 0.25
      use_astar: false
      # <<< navfn-planner
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    # 2.0 s of simulated travel vetoed every Spin/DriveOnHeading recovery
    # when the camera layer had nearby marks (Collision Ahead loop).
    simulate_ahead_time: 0.6
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.6
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 500
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.15
    - 0.0
    - 0.3
    min_velocity:
    - -0.05
    - 0.0
    - -0.3
    max_accel:
    - 0.25
    - 0.0
    - 0.6
    max_decel:
    - -0.25
    - 0.0
    - -0.6
    odom_topic: /wheel_odom
    odom_duration: 0.2
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /wheel_odom
    # 10 ms = 100 Hz. The Jetson cannot sustain that while planning; the
    # 2026-08-25 run logged continuous "tick rate 100.00 was exceeded".
    # 20 ms is still faster than the 15 Hz controller.
    bt_loop_duration: 20
    default_server_timeout: 20
    wait_for_service_timeout: 2000
    default_nav_to_pose_bt_xml: __BT_XML__
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node

velocity_guard:
  ros__parameters:
    use_sim_time: false
    input_topic: /cmd_vel_smoothed
    output_topic: /cmd_vel_guarded
    scan_topic: /scan_filtered
    odom_topic: /wheel_odom
    battery_topic: /battery_state
    require_battery: false
    require_camera: false
    max_linear_speed: 0.26
    max_angular_speed: 0.9
    command_timeout: 1.5
    scan_timeout: 0.6
    odom_timeout: 1.0
    battery_timeout: 2.0
    min_battery_voltage: 11.0
    minimum_valid_scan_points: 30
    # Body half-length is 0.21 m. Stop ~20 cm before a plain wall so lidar
    # hits that the self-box (0.22 m) still keeps are enough to veto forward.
    front_stop_distance: 0.42
    stop_half_angle: 0.70
    stop_min_points: 3
    blocked_turn_speed: 0.35
    publish_rate: 20.0
    diagnostic_rate: 1.0

slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_uniform  # fixed-grid rebin; karto rejects variable-length raw scans
    use_map_saver: true
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    scan_queue_size: 1
    transform_publish_period: 0.04
    map_update_interval: 1.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.08
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 8.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 5
    loop_match_maximum_variance_coarse: 2.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 10.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    # 0.1 marked a cell occupied on 10% hit evidence; on the real rover that
    # turned stray returns and walking humans into single-cell speckle which
    # the costmap inflated into 0.35 m no-go disks all over open floor
    # (drive_2026-08-20 t=502s). 0.25 requires real evidence before a cell
    # becomes a wall.
    occupancy_threshold: 0.25

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      angular_dist_threshold: 0.5
      angular_disengage_threshold: 0.25
      forward_sampling_distance: 0.35
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      closed_loop: true
      desired_linear_vel: 0.26
      lookahead_dist: 0.5
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      # Slow down for tight curves and near obstacles instead of refusing to move.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.35
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0
      # In-place rotation is cheap on a skid-steer chassis; let it use that
      # rather than needing room for an arc.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      rotate_to_heading_angular_vel: 0.6
      allow_reversing: false
      max_robot_pose_search_dist: 5.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.025
      footprint: '[[0.21, 0.21], [0.21, -0.21], [-0.21, -0.21], [-0.21, 0.21]]'
      footprint_padding: 0.01
      transform_tolerance: 0.3
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        footprint_clearing_enabled: true
        enabled: true
        observation_sources: scan camera
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.02
          max_obstacle_height: 1.2
          obstacle_min_range: 0.05
          obstacle_max_range: 4.0
          raytrace_min_range: 0.05
          raytrace_max_range: 5.0
          inf_is_valid: true
        camera:
          topic: /camera/camera/depth/color/points
          data_type: PointCloud2
          marking: true
          clearing: true
          # Above the floor plane, below the rover's own camera mast, so the
          # layer sees table bases and crossbars the 2-D lidar plane misses.
          min_obstacle_height: 0.06
          max_obstacle_height: 0.60
          obstacle_min_range: 0.25
          obstacle_max_range: 2.5
          raytrace_min_range: 0.25
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      footprint: '[[0.21, 0.21], [0.21, -0.21], [-0.21, -0.21], [-0.21, 0.21]]'
      footprint_padding: 0.01
      track_unknown_space: true
      transform_tolerance: 0.3
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        footprint_clearing_enabled: true
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.02
          max_obstacle_height: 1.2
          obstacle_min_range: 0.05
          obstacle_max_range: 4.0
          raytrace_min_range: 0.05
          raytrace_max_range: 5.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
      # >>> navfn-planner (apply_navfn_planner.py)
      # original:
      #     GridBased:
      #       plugin: nav2_smac_planner/SmacPlannerLattice
      #       lattice_filepath: __LATTICE_FILE__
      #       tolerance: 0.15
      #       allow_unknown: true
      #       max_iterations: 1000000
      #       max_on_approach_iterations: 1000
      #       max_planning_time: 5.0
      #       analytic_expansion_ratio: 3.5
      #       analytic_expansion_max_length: 2.5
      #       reverse_penalty: 2.5
      #       change_penalty: 0.2
      #       non_straight_penalty: 1.15
      #       cost_penalty: 3.0
      #       retrospective_penalty: 0.025
      #       rotation_penalty: 2.0
      #       lookup_table_size: 10.0
      #       cache_obstacle_heuristic: true
      #       allow_reverse_expansion: true
      #       smooth_path: false
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      # Frontier goals sit on the boundary of known space by construction, so
      # a planner that refuses unknown cells cannot reach any of them.
      allow_unknown: true
      # Wider than the lattice's 0.15: explore_lite's goals land wherever the
      # frontier centroid is, which is often a cell or two inside inflation.
      tolerance: 0.25
      use_astar: false
      # <<< navfn-planner
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.6
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 500
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.1
    - 0.0
    - 0.3
    min_velocity:
    - -0.05
    - 0.0
    - -0.3
    max_accel:
    - 0.25
    - 0.0
    - 0.6
    max_decel:
    - -0.25
    - 0.0
    - -0.6
    odom_topic: /wheel_odom
    odom_duration: 0.2
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5

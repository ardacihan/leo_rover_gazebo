collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_raw
    cmd_vel_out_topic: /cmd_vel
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: false
    stop_pub_timeout: 1.0

    # Leo is approximately 0.44 x 0.44 m. The approach footprint is the true
    # chassis rectangle plus margin (front +0.06, sides/rear +0.04), not the
    # old 0.35 m circumscribed circle: on 2026-08-14 that circle permanently
    # vetoed forward motion past a table leg sitting 0.30 m from center
    # (8 cm from the wheel) even though the straight path was clear. The
    # time-to-collision simulation still rotates this polygon, so a turn that
    # would sweep a corner into the same leg remains blocked.
    polygons: [FootprintApproach]
    # The approach model simulates the commanded velocity against the rover
    # footprint.  Unlike a fixed stop rectangle, it permits a slow reverse
    # away from a front wall and permits a turn that increases clearance.
    FootprintApproach:
      type: polygon
      # In this nav2 Humble build (1.1.20) an APPROACH polygon takes no
      # static `points` parameter at all (neither array nor string form is
      # declared — both are silently ignored and the polygon waits on a
      # footprint topic instead). The rectangle is therefore published by
      # scripts/footprint_publisher.py; if that publisher is absent the
      # polygon stays empty and the approach check passes everything, so
      # verify /collision_monitor/footprint has one publisher before motion.
      footprint_topic: /collision_monitor/footprint
      action_type: approach
      # Back to 1.5 s (2026-08-14 evening): at 0.14 m/s the rover was nosing
      # into pockets it could not escape; the operator now prefers larger
      # obstacle standoff and open-area exploration over tight coverage.
      time_before_collision: 1.5
      simulation_time_step: 0.1
      max_points: 5
      visualize: true
      polygon_pub_topic: /collision_monitor/approach_footprint
      enabled: true
    # This scan is already transformed into base_footprint and contains the
    # bounded-self-filtered LIDAR plus ground-filtered RealSense obstacles.
    observation_sources: [fused_scan]
    fused_scan:
      type: scan
      topic: /scan_collision_fused
      enabled: true

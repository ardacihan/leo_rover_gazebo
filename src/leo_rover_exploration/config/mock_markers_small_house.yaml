# Ground-truth ArUco marker poses for the AWS small_house world.
# yaw = outward normal of the wall face the marker is glued to (flush!).
# Every pose below was fitted against the world's reference SLAM map
# (src/aws_small_house/maps/turtlebot3_waffle_pi) with
# scripts/check_marker_orientation.py before the first run.
#
# 0 and 4 sit on the south wall of the central living area facing north -
# the space BOTH rovers must cross, so they are the shared witnesses the
# map merge needs. 7 and 8 are on the central interior wall.
markers:
  - {id: 0, x: -5.0, y: -5.75, z: 0.3, yaw: 1.5708}   # south wall west, faces north
  - {id: 1, x: -9.35, y: -2.0, z: 0.3, yaw: 0.0}      # west outer wall, faces east
  - {id: 2, x: -9.3, y: 2.2, z: 0.3, yaw: 0.0}        # west wall, NW room
  - {id: 3, x: 2.0, y: 5.4, z: 0.3, yaw: -1.5708}     # top-section north wall, faces south
  - {id: 4, x: 5.0, y: -5.75, z: 0.3, yaw: 1.5708}    # south wall east, faces north
  - {id: 5, x: 9.45, y: -1.0, z: 0.3, yaw: 3.1416}    # east outer wall, faces west
  - {id: 6, x: 9.4, y: 2.0, z: 0.3, yaw: 3.1416}      # east wall north, faces west
  - {id: 7, x: -2.75, y: -2.8, z: 0.3, yaw: 3.1416}   # central interior wall, faces west
  - {id: 8, x: -2.7, y: 0.6, z: 0.3, yaw: 3.1416}     # central interior wall upper, faces west

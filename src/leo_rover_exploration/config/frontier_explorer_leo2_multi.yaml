# Multi-robot collaborative explorer params for leo2.
# Frontiers are detected on the MERGED /map; peer poses come from the shared
# TF tree; coordination_mode is overridden per benchmark condition by the
# launch file. Camera sweep is disabled (target 0.0) so runs measure pure
# collaborative lidar mapping. `/**` so the keys bind under /leo2/... .
/**:
  ros__parameters:
    use_sim_time: true
    robot_name: leo2
    robot_base_frame: leo2/base_link
    camera_frame: leo2/sensor_camera_link
    map_topic: /leo2/map
    map_frame: leo2/map
    cmd_vel_topic: /leo2/cmd_vel
    detections_topic: /leo2/aruco_detections
    # --- multi-robot coordination ---
    coordination_mode: coordinated       # coordinated | independent
    peer_names: leo1
    discount_radius: 3.0
    discount_strength: 1.0
    candidate_map_topic: /leo1/map
    candidate_transform_topic: /alignment_candidate_transform
    alignment_confidence_topic: /alignment_confidence
    candidate_guidance_min_confidence: 0.15
    # --- exploration ---
    planner_frequency: 0.25
    min_frontier_size: 0.5
    # Higher distance penalty: finish what is near before crossing the
    # building. Goal logs showed east-west corridor thrash (9.5 -> 5.1 ->
    # 12.8 -> 7.6 -> 14.6 m jumps) under 3.0.
    potential_scale: 4.0
    gain_scale: 1.0
    progress_timeout: 30.0
    blacklist_radius: 0.6
    blacklist_ttl: 90.0
    # 900 s outlived half a run: 10 planner-reject long-bans once wrote off
    # three husarion rooms for good. Maps evolve; retry in 5 minutes.
    blacklist_long_ttl: 300.0
    blacklist_max_strikes: 3
    replan_distance: 0.7
    goal_commit_time: 20.0
    switch_margin: 1.6
    validate_goals: true
    planner_action_name: compute_path_to_pose
    skip_ttl: 20.0
    claim_radius: 1.5
    frontier_utility: linear
    gain_radius: 2.5
    min_remaining_room_m2: 2.0
    # Finish the room you are in before crossing the building (see the
    # husarion back-and-forth evidence, 2026-08-30 afternoon).
    local_first_radius: 4.0
    # 0.30 eroded doorway frontiers to nothing in furniture-dense maps.
    frontier_min_clearance: 0.20
    idle_cycles_to_finish: 8
    watchdog_period: 10.0
    return_to_init: false
    map_save_path: /ros2_ws/maps/leo2_map
    camera_fov: 1.047
    detection_range: 3.0
    camera_coverage_target: 0.0
    sweep_min_cluster: 5
    sweep_max_cluster: 60
    sweep_heading_weight: 0.75
    coverage_update_period: 0.5
    verify_min_views: 2
    verify_max_attempts: 2
    verify_min_view_distance: 0.5
    verify_min_view_interval: 5.0
    verify_min_yaw_delta: 0.35

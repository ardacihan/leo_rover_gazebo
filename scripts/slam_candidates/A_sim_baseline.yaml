# Candidate A -- the configuration currently on ivan-branch
# (src/leo_rover_gazebo/config/slam_params_leo.yaml), unchanged.
# Tuned against ground-truth sim odometry and a clean 20 m lidar.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: "leo1/odom"
    base_frame: "leo1/base_link"
    map_frame: "map"
    scan_topic: "/leo1/scan"

    mode: mapping

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_time_interval: 0.15
    scan_queue_size: 5

    resolution: 0.05
    max_laser_range: 20.0
    map_update_interval: 1.0
    transform_publish_period: 0.05

    solver_plugin: "solver_plugins::CeresSolver"
    ceres_linear_solver: "SPARSE_NORMAL_CHOLESKY"
    ceres_preconditioner: "SCHUR_JACOBI"
    ceres_trust_strategy: "LEVENBERG_MARQUARDT"

    do_loop_closing: true
    loop_search_maximum_distance: 5.0
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    correlation_search_space_dimension: 0.8
    coarse_search_angle_offset: 0.523

    tf_buffer_duration: 30.0
    transform_timeout: 0.5
    stack_size_to_use: 40000000
    enable_interactive_mode: true

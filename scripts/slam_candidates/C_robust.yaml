# Candidate C -- candidate B re-tuned for an odometry prior that actually drifts.
#
# Every change is aimed at one of two failure modes seen when wheel-only
# skid-steer odometry feeds the mapper:
#
#   1. the per-scan search window is too small to absorb the yaw a skid-steer
#      loses in an in-place turn, so scan matching quietly fails and the graph
#      bends;
#   2. loop closure never fires, because by the time the rover returns to a
#      known place the accumulated drift has pushed it outside the loop search
#      radius -- so nothing ever corrects (1).
#
# Deltas from B are marked. Frames/topic/clock are the simulation equivalents.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: "leo1/odom"
    base_frame: "leo1/base_link"
    map_frame: "map"
    scan_topic: "/leo1/scan_real"

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05

    # B: 0.20 -> 0.25. REAL_ROVER_GUIDE.md measures the camera bracket's fixed
    # self-return at 0.06-0.17 m; keep the mapper's floor clear of it even when
    # the sector filter is not in the chain.
    min_laser_range: 0.25
    # B: 12.0 -> 11.0. Stay inside the RPLIDAR C1's real limit so a clamped
    # no-return is never mistaken for a hit at max range.
    max_laser_range: 11.0
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    # B: 10 -> 30. A longer running buffer gives the matcher more local chains
    # to link against in a corridor, where any single scan is ambiguous.
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.12
    # B: 1.5 -> 2.5. More graph constraints per scan.
    link_scan_maximum_distance: 2.5

    do_loop_closing: true
    # B: 3.0 -> 10.0. THE load-bearing change. Loop candidates are searched
    # within this radius of the current estimate; if drift exceeds it before the
    # rover revisits a place, loop closure can never fire and drift is permanent.
    loop_search_maximum_distance: 10.0
    # B: 10 -> 6. Easier to satisfy in small rooms, still long enough that an
    # isolated bad scan cannot pass as a loop.
    loop_match_minimum_chain_size: 6
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    # Kept at the default: lowering this is what produces false loop closures
    # and the rotated-duplicate-map failure.
    loop_match_minimum_response_fine: 0.45

    # B: 0.5 -> 0.7, 0.349 -> 0.44. Headroom for the yaw a skid-steer loses in
    # an in-place turn, which is where the odometry prior is worst.
    correlation_search_space_dimension: 0.7
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    # B: 8.0 -> 12.0. The loop-closure correlation grid has to cover the drift
    # that accumulated since the place was first seen.
    loop_search_space_dimension: 12.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.44
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1

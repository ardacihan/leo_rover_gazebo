# Candidate E -- the hardware config (B) with ONLY the loop-closure reach
# changed. Nothing else.
#
# This exists to test the central claim in isolation: that
# loop_search_maximum_distance = 3.0 is the load-bearing defect, because wheel
# odometry passes 3 m of error early in a run and loop closure can then never
# fire again.
#
# Candidate C bundled that change with six others and turned out to be
# unreliable (0.25-0.80 across seeds). If E is both better than B and stable,
# it is the honest minimal recommendation -- the smallest change that helps,
# rather than the largest change that once scored well.
#
# Diff from B_real_branch.yaml is exactly two lines, marked below.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: "leo1/odom"
    base_frame: "leo1/base_link"
    map_frame: "map"
    scan_topic: "/leo1/scan_real_selffiltered"

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.20
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    do_loop_closing: true
    # CHANGED from B: 3.0 -> 10.0. The only substantive edit.
    loop_search_maximum_distance: 10.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    # CHANGED from B: 8.0 -> 12.0, so the correlation grid can actually cover
    # the drift the wider search radius now reaches over.
    loop_search_space_dimension: 12.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
